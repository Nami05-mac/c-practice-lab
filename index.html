<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>C Practice Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Layout: a game-like home (hero, stats, topic cards), then a split workspace per question: task and help on the left, editor on the right.
   Palette: warm paper neutrals, one clay accent, five soft topic tints. Type: Newsreader titles, DM Sans UI, JetBrains Mono code. */
:root {
  --bg: #faf9f5; --surface: #ffffff; --sunken: #f3f1ea; --line: #e5e2d8; --line-strong: #cfcbbd;
  --fg: #1f1e1d; --muted: #6b675e; --accent: #c4613f; --accent-ink: #ffffff; --accent-soft: #f7e6de;
  --ok: #2f7a45; --ok-soft: #e4f0e5; --warn: #946509; --warn-soft: #f6ecd0; --bad: #b0412f; --bad-soft: #f8e3de;
  --plum: #76508a; --plum-soft: #eee5f2;
  --tn1: #f7e6de; --ti1: #a8452a; --tn2: #e9eed8; --ti2: #586b1f; --tn3: #e0ecf2; --ti3: #2d6585; --tn4: #eee5f2; --ti4: #76508a; --tn5: #f3ead3; --ti5: #8a6410;
  --term: #262624; --term-fg: #eceae2; --term-dim: #a39f93;
  --shadow: 0 1px 2px rgba(31,30,29,.05), 0 6px 18px -8px rgba(31,30,29,.14);
  --t-kw: #a8452a; --t-str: #2c7447; --t-num: #8a5a00; --t-cm: #8a857a; --t-pre: #76508a; --t-fmt: #0b6a95;
  --font-ui: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #262624; --surface: #30302e; --sunken: #1f1e1d; --line: #403e3a; --line-strong: #57544d;
  --fg: #eceae2; --muted: #a39f93; --accent: #d97757; --accent-ink: #1f1e1d; --accent-soft: #4a3228;
  --ok: #86c694; --ok-soft: #2a3a2e; --warn: #e2b660; --warn-soft: #3f3519; --bad: #e88d7f; --bad-soft: #4a2b26;
  --plum: #cba7dc; --plum-soft: #3b2c45;
  --tn1: #4a3228; --ti1: #eda085; --tn2: #353b24; --ti2: #b7cb7c; --tn3: #243844; --ti3: #8cc4e2; --tn4: #3b2c45; --ti4: #cba7dc; --tn5: #433818; --ti5: #e8c36f;
  --term: #1a1918; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.5);
  --t-kw: #e68f6f; --t-str: #8fcb9b; --t-num: #e3b863; --t-cm: #8d897e; --t-pre: #cba7dc; --t-fmt: #7cc4e8;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #262624; --surface: #30302e; --sunken: #1f1e1d; --line: #403e3a; --line-strong: #57544d;
  --fg: #eceae2; --muted: #a39f93; --accent: #d97757; --accent-ink: #1f1e1d; --accent-soft: #4a3228;
  --ok: #86c694; --ok-soft: #2a3a2e; --warn: #e2b660; --warn-soft: #3f3519; --bad: #e88d7f; --bad-soft: #4a2b26;
  --plum: #cba7dc; --plum-soft: #3b2c45;
  --tn1: #4a3228; --ti1: #eda085; --tn2: #353b24; --ti2: #b7cb7c; --tn3: #243844; --ti3: #8cc4e2; --tn4: #3b2c45; --ti4: #cba7dc; --tn5: #433818; --ti5: #e8c36f;
  --term: #1a1918; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px -10px rgba(0,0,0,.5);
  --t-kw: #e68f6f; --t-str: #8fcb9b; --t-num: #e3b863; --t-cm: #8d897e; --t-pre: #cba7dc; --t-fmt: #7cc4e8;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.55;
  padding-block: 20px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, textarea, input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
code { font-family: var(--font-mono); font-size: 0.88em; background: var(--sunken); border: 1px solid var(--line); padding: 0.05em 0.35em; border-radius: 5px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { display: block; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 26px; }
.brand { font-family: var(--font-display); font-size: 23px; font-weight: 500; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-weight: 700; font-size: 17px; display: grid; place-items: center; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px 5px 10px; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat svg { width: 16px; height: 16px; }
.stat small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.stat.fire svg { color: var(--accent); } .stat.xp svg { color: var(--ti5); } .stat.rank svg { color: var(--ti4); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 7px 18px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; transition: transform .12s ease, background .12s ease; }
.btn:hover { background: var(--sunken); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 rgba(0,0,0,.14); }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.sm { min-height: 32px; padding: 3px 12px; font-size: 13px; border-radius: 8px; }
.btn svg { width: 16px; height: 16px; }
.ghost { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; font-size: 12.5px; font-weight: 500; }
.ghost:hover { color: var(--fg); background: var(--sunken); }
.link { color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 0; cursor: pointer; }
.link:hover { color: var(--fg); }

h1, h2, h3 { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lede { color: var(--muted); max-width: 56ch; margin: 0; font-size: 16.5px; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: center; background: var(--accent-soft); border-radius: 24px; padding: 38px 40px; margin-bottom: 38px; position: relative; overflow: hidden; }
.hero h1 { font-size: clamp(34px, 5.2vw, 54px); line-height: 1.04; margin: 10px 0 14px; }
.hero h1 em { font-style: italic; color: var(--accent); }
.hero .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.hero .ringline { display: flex; align-items: center; gap: 14px; margin-top: 24px; color: var(--muted); font-size: 14px; }
.hero .ringline strong { color: var(--fg); font-weight: 600; }
.term { background: var(--term); color: var(--term-fg); border-radius: 16px; box-shadow: var(--shadow); font-family: var(--font-mono); font-size: 13.5px; line-height: 1.7; transform: rotate(1.2deg); min-width: 0; overflow: hidden; }
.dots { display: flex; gap: 6px; padding: 11px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: #55524b; display: block; }
.dots i:nth-child(1) { background: #d96a55; } .dots i:nth-child(2) { background: #dcb257; } .dots i:nth-child(3) { background: #78b27f; }
.term pre { margin: 0; padding: 14px 18px 18px; overflow-x: auto; white-space: pre; }
.term .p { color: var(--term-dim); } .term .o { color: #8fcb9b; }
.cursor { display: inline-block; width: 8px; height: 15px; background: var(--term-fg); vertical-align: -2px; animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* topic cards */
.sect-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.sect-head h2 { font-size: 26px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 16px; }
.tcard { display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; min-width: 0; }
.tcard:hover { transform: translateY(-3px); border-color: var(--line-strong); }
.tcard .top2 { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.glyph { min-width: 54px; height: 54px; padding: 0 12px; border-radius: 14px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 17px; }
.tcard h3 { font-size: 21px; line-height: 1.2; }
.tcard p { margin: 0; color: var(--muted); font-size: 13.5px; }
.minidots { display: flex; gap: 4px; flex-wrap: wrap; }
.minidots i { width: 9px; height: 9px; border-radius: 3px; background: var(--sunken); border: 1px solid var(--line-strong); display: block; }
.minidots i.on { background: var(--ok); border-color: var(--ok); }
.tcard .foot { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin-top: auto; }
.tcard .foot b { color: var(--fg); font-variant-numeric: tabular-nums; }
.go { color: var(--accent); font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.go svg { width: 14px; height: 14px; }
.t1 { background: var(--tn1); color: var(--ti1); } .t2 { background: var(--tn2); color: var(--ti2); } .t3 { background: var(--tn3); color: var(--ti3); } .t4 { background: var(--tn4); color: var(--ti4); } .t5 { background: var(--tn5); color: var(--ti5); }

/* topic page */
.crumb { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-bottom: 18px; }
.crumb a { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; }
.crumb a:hover { color: var(--fg); }
.crumb svg { width: 15px; height: 15px; }
.thead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: center; margin-bottom: 22px; }
.thead .glyph { min-width: 76px; height: 76px; font-size: 24px; border-radius: 20px; }
.thead h1 { font-size: clamp(30px, 4.4vw, 42px); line-height: 1.1; }
.recapcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 28px; margin-bottom: 22px; }
.recapcard h3 { grid-column: 1 / -1; font-family: var(--font-ui); font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.recapcard p { margin: 0; font-size: 14.5px; padding-left: 14px; border-left: 3px solid var(--accent-soft); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-bottom: 16px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .k { font-size: 12.5px; color: var(--muted); margin-right: 2px; }
.chip { border: 1px solid var(--line-strong); background: none; border-radius: 999px; padding: 4px 13px; font-size: 13px; cursor: pointer; color: var(--muted); font-weight: 500; }
.chip:hover { color: var(--fg); background: var(--sunken); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.qtile { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); transition: transform .15s ease, border-color .15s ease; }
.qtile:hover { transform: translateY(-2px); border-color: var(--line-strong); }
.qtile .num { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 14px; background: var(--sunken); color: var(--muted); }
.qtile.isdone .num { background: var(--ok); color: var(--accent-ink); }
.qtile .num svg { width: 18px; height: 18px; }
.qtile .t { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; display: block; }
.qtile .m { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.kind { font-size: 12.5px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.lv-easy { color: var(--ok); background: var(--ok-soft); }
.lv-medium { color: var(--warn); background: var(--warn-soft); }
.lv-challenge { color: var(--plum); background: var(--plum-soft); }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 14px; }

/* question page */
.qbar { display: flex; align-items: center; gap: 16px; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; }
.qbar .back { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; color: var(--muted); font-size: 14px; }
.qbar .back:hover { color: var(--fg); }
.qbar .back svg { width: 15px; height: 15px; }
.trail { display: flex; gap: 5px; flex: 1; justify-content: center; min-width: 120px; flex-wrap: wrap; }
.trail a { width: 22px; height: 8px; border-radius: 99px; background: var(--line-strong); display: block; }
.trail a.on { background: var(--ok); } .trail a.cur { background: var(--accent); width: 34px; }
.qnav { display: flex; gap: 6px; align-items: center; }
.qnav .btn { min-width: 40px; padding: 4px 10px; }
.qnav span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.qgrid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "task work" "help work"; grid-template-rows: min-content 1fr; gap: 28px 36px; align-items: start; }
.pane-task { grid-area: task; } .pane-help { grid-area: help; } .pane-work { grid-area: work; position: sticky; top: 20px; display: flex; flex-direction: column; gap: 14px; }
.pane-task, .pane-help { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pane-work { min-width: 0; }
.qtitle { display: flex; flex-direction: column; gap: 10px; }
.qtitle h1 { font-size: clamp(28px, 3.6vw, 38px); line-height: 1.12; }
.pills { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.task { font-size: 17px; line-height: 1.6; margin: 0; max-width: 62ch; }
.note { color: var(--muted); font-size: 13.5px; margin: 0; }
details.recap { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details.recap summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 13.5px; list-style: none; display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
details.recap summary::-webkit-details-marker { display: none; }
details.recap summary::after { content: "+"; font-size: 18px; line-height: 1; }
details.recap[open] summary::after { content: "–"; }
details.recap ul { margin: 0; padding: 0 14px 14px 32px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
.io { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.box { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-width: 0; overflow: hidden; }
.box .lab { font-size: 11.5px; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--sunken); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.box pre { margin: 0; padding: 10px 12px; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.55; overflow-x: auto; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }

.code { border: 1px solid var(--line); border-radius: 12px; background: var(--sunken); min-width: 0; overflow: hidden; }
.code-bar { display: flex; justify-content: space-between; align-items: center; padding: 3px 8px 3px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); min-height: 34px; font-family: var(--font-mono); }
.code pre { margin: 0; padding: 12px 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6; tab-size: 4; }
.code code { background: none; border: 0; padding: 0; font-size: inherit; }
.t-kw { color: var(--t-kw); font-weight: 500; } .t-str { color: var(--t-str); } .t-num { color: var(--t-num); }
.t-cm { color: var(--t-cm); font-style: italic; } .t-pre { color: var(--t-pre); } .t-fmt { color: var(--t-fmt); }

.win { --e-bg: #1f1e1d; --e-fg: #eceae2; --e-dim: #a39f93; --e-line: #2f2e2b; --e-hover: rgba(255,255,255,.08); --e-caret: #d97757; border: 1px solid var(--line-strong); border-radius: 16px; background: var(--e-bg); color: var(--e-fg); overflow: hidden; box-shadow: var(--shadow); }
.win:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.win .bar { display: flex; align-items: center; gap: 12px; padding: 0 8px 0 0; border-bottom: 1px solid var(--e-line); }
.win .bar .dots { border: 0; }
.win .bar .fname { font-family: var(--font-mono); font-size: 12.5px; color: var(--e-dim); flex: 1; }
.win .bar .ghost { color: var(--e-dim); } .win .bar .ghost:hover { color: var(--e-fg); background: var(--e-hover); }
.ed { display: grid; grid-template-columns: auto minmax(0, 1fr); }
.edwrap { position: relative; min-width: 0; }
.mono { font-family: var(--font-mono); font-size: var(--e-fs, 13.5px); line-height: 1.6; tab-size: 4; white-space: pre; font-variant-ligatures: none; letter-spacing: 0; }
.gut { margin: 0; padding: 14px 10px 14px 14px; color: var(--e-gutc, #77736a); text-align: right; user-select: none; overflow: hidden; border-right: 1px solid var(--e-line); }
.hlp { position: absolute; inset: 0; margin: 0; padding: 14px 14px 40px; overflow: hidden; pointer-events: none; color: var(--e-fg); }
.hlp.static { position: static; overflow: auto; padding-bottom: 14px; }
textarea.src { display: block; position: relative; z-index: 1; width: 100%; border: 0; background: transparent; color: transparent; -webkit-text-fill-color: transparent; padding: 14px; resize: vertical; min-height: 300px; overflow: auto; outline: none; caret-color: var(--e-caret); }
textarea.src::selection { background: rgba(120,150,220,.35); -webkit-text-fill-color: transparent; }
.e-kw { color: var(--e-kw); font-weight: 500; } .e-ty { color: var(--e-ty); } .e-fn { color: var(--e-fn); } .e-id { color: var(--e-id); }
.e-str { color: var(--e-str); } .e-fmt { color: var(--e-fmt); } .e-num { color: var(--e-num); } .e-pre { color: var(--e-pre); }
.e-cm { color: var(--e-cm); font-style: italic; } .e-op { color: var(--e-op); } .e-pn { color: var(--e-pn); }
/* colours page */
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 0 0 22px; }
.preset { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 14px; padding: 10px; cursor: pointer; text-align: left; font: inherit; color: var(--fg); display: flex; flex-direction: column; gap: 8px; }
.preset:hover { border-color: var(--accent); }
.preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.preset .sw { display: flex; align-items: center; gap: 5px; border-radius: 8px; padding: 9px 10px; }
.preset .sw i { width: 12px; height: 12px; border-radius: 50%; display: block; }

      case "resetcode": drafts[q.key] = { t: Date.now(), v: null }; save("cpl:drafts", drafts); setupEditor(q); break;
      case "notes": u.notesOpen = !u.notesOpen; renderNotes(q); if (u.notesOpen && $("notetext")) $("notetext").focus(); break;
      case "run": startRun(q, "normal"); break;
      case "runex": startRun(q, "example"); break;
      case "clearterm": u.run = null; u.inputs = []; u.result = null; renderTerm(q); renderResult(q); break;
      case "case": u.caseIx = +el.dataset.v; renderCases(q); break;
      case "checkans": doCheckAns(q); break;
      case "reveal": u.revealed = true; renderCheck(q); renderHelp(q); break;
      case "hint": u.hints++; renderHelp(q); break;
      case "walk": u.walk = 1; renderHelp(q); break;
      case "nextstep": u.walk++; renderHelp(q); break;
      case "allsteps": u.walk = q.steps.length; renderHelp(q); break;
      case "toggledone": setDone(q, !isDone(q), !isDone(q)); renderDone(q); break;
    }
  });

  route();
  initCloud();
})();
</script>
